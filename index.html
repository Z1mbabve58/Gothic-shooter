        (function initMenuFireFx() {
            const canvas = document.getElementById('menu-fire-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const sparks = [];
            const flameTongues = [];

            for (let i = 0; i < 40; i++) {
                sparks.push({
                    x: 0, y: 0, vx: (Math.random() - 0.5) * 1.8, vy: -(1.4 + Math.random() * 2.6),
                    size: 2 + Math.random() * 3, life: Math.random(), decay: 0.008 + Math.random() * 0.012,
                    color: Math.random() > 0.35 ? '#ffaa22' : '#ff3300'
                });
            }

            for (let i = 0; i < 16; i++) {
                flameTongues.push({
                    ox: (Math.random() - 0.5) * 32, oy: (Math.random() - 0.5) * 18,
                    w: 16 + Math.random() * 20, h: 28 + Math.random() * 40,
                    phase: Math.random() * Math.PI * 2, speed: 3 + Math.random() * 4,
                    color: ['#ffdd55', '#ff9911', '#ff4400'][Math.floor(Math.random() * 3)]
                });
            }

            function loop() {
                if (gameActive) return; 
                requestAnimationFrame(loop);

                const time = performance.now(); // Защита от ошибки времени
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const fireX = canvas.width * 0.642; 
                const fireY = canvas.height * 0.745;

                const t = time * 0.003;
                
                const pulse = Math.sin(t * 7) * 0.08 + Math.cos(t * 11) * 0.05;
                const glowRadius = Math.max(90, canvas.width * 0.12) * (1 + pulse);
                const grad = ctx.createRadialGradient(fireX, fireY - 15, 10, fireX, fireY - 15, glowRadius);
                grad.addColorStop(0, 'rgba(255, 140, 20, 0.55)');
                grad.addColorStop(0.4, 'rgba(255, 60, 0, 0.25)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(fireX, fireY - 15, glowRadius, 0, Math.PI * 2);
                ctx.fill();

                flameTongues.forEach(f => {
                    const wave = Math.sin(t * f.speed + f.phase);
                    const waveH = Math.cos(t * (f.speed * 1.3) + f.phase);
                    const curW = f.w * (0.85 + wave * 0.25);
                    const curH = f.h * (0.9 + waveH * 0.35);
                    ctx.fillStyle = f.color;
                    ctx.globalAlpha = 0.55 + wave * 0.25;
                    ctx.fillRect(fireX + f.ox - curW / 2, fireY + f.oy - curH, curW, curH);
                });
                ctx.globalAlpha = 1.0;

                sparks.forEach(s => {
                    if (s.life <= 0) {
                        s.x = fireX + (Math.random() - 0.5) * 26;
                        s.y = fireY + (Math.random() - 0.5) * 14;
                        s.vx = (Math.random() - 0.5) * 1.5;
                        s.vy = -(1.6 + Math.random() * 3.0);
                        s.life = 1.0;
                    }
                    s.x += s.vx + Math.sin(time * 0.005 + s.x) * 0.35;
                    s.y += s.vy;
                    s.life -= s.decay;
                    ctx.fillStyle = s.color;
                    ctx.globalAlpha = Math.max(0, s.life);
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
                ctx.globalAlpha = 1.0;
            }
            gameActive = false;
            loop(); // Стартуем безопасно
        })();

        // Вызываем настройку диорамы при загрузке страницы
       // ==========================================

            function loop(time) {

                grad.addColorStop(0, 'rgba(255, 140, 20, 0.45)');

                sparks.forEach(s => {

let currentLbTab = 'training';

const lbModal = document.getElementById('leaderboard-modal');
const lbOpenBtn = document.getElementById('btn-leaderboard-open');
const lbCloseBtn = document.getElementById('btn-lb-close');

if (lbOpenBtn && lbModal) {
    lbOpenBtn.onclick = () => {
        lbModal.style.display = 'block';
        loadLeaderboard(currentLbTab);
    };
}
if (lbCloseBtn && lbModal) {
    lbCloseBtn.onclick = () => {
        lbModal.style.display = 'none';
    };
}

function switchLbTab(tab) {
    currentLbTab = tab;
    document.querySelectorAll('.lb-tab-btn').forEach(btn => btn.classList.remove('active'));
    if (window.event && window.event.target) {
        window.event.target.classList.add('active');
    }
    
    const colTitle = document.getElementById('lb-val-col-title');
    if (colTitle) {
        if (tab === 'training') {
            colTitle.innerText = "Max Wave";
        } else if (tab === 'duel_weekly') {
            colTitle.innerText = "Weekly Wins";
        } else {
            colTitle.innerText = "Monthly Points";
        }
    }
    
    loadLeaderboard(tab);
}

function loadLeaderboard(tab) {
    if (typeof socket !== 'undefined') {
        socket.emit('get_leaderboard', tab);
    }
}

// Прием данных лидерборда от сервера
if (typeof socket !== 'undefined') {
    socket.on('leaderboard_data', ({ tab, list }) => {
        if (tab !== currentLbTab) return;
        const tbody = document.getElementById('lb-table-body');
        if (!tbody) return;
        tbody.innerHTML = '';

       if (!list || list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#666; padding:20px;">No data for this season</td></tr>`;
    return;
}

        list.forEach((entry, index) => {
            const tr = document.createElement('tr');
            let rankClass = '';
            if (index === 0) rankClass = 'lb-rank-1';
            else if (index === 1) rankClass = 'lb-rank-2';
            else if (index === 2) rankClass = 'lb-rank-3';

            const shortAddr = `${entry.address.slice(0, 6)}...${entry.address.slice(-4)}`;
            
            tr.innerHTML = `
                <td class="${rankClass}">${index + 1}</td>
                <td>${shortAddr}</td>
                <td style="text-align: right; color: #ffaa00; font-weight: bold;">${entry.value}</td>
            `;
            tbody.appendChild(tr);
        });
    });
}
// === СИСТЕМА НИКНЕЙМОВ И GAME OVER ===
let playerName = localStorage.getItem('gothic_player_name');

// При загрузке страницы проверяем, есть ли сохраненный ник
window.addEventListener('load', () => {
    if (!playerName) {
        document.getElementById('nickname-modal').style.display = 'flex';
    }
});

// Сохранение ника
document.getElementById('btn-save-nickname').addEventListener('click', () => {
    const val = document.getElementById('nickname-input').value.trim();
    if (val.length > 2) {
        playerName = val;
        localStorage.setItem('gothic_player_name', playerName);
        document.getElementById('nickname-modal').style.display = 'none';
    } else {
        alert("Name must be at least 3 characters!");
    }
});

// Перезапуск игры из меню смерти
document.getElementById('btn-restart').addEventListener('click', () => {
    location.reload(); 
});

// Единая функция СМЕРТИ (вызывается, когда HP <= 0)
function triggerGameOver() {
    if (!gameActive) return; // Защита от двойного срабатывания
    gameActive = false;
    document.exitPointerLock(); // Освобождаем мышку

    // Останавливаем музыку боя
    const bgmGame = document.getElementById('bgm-game');
    if (bgmGame) bgmGame.pause();

    // Отправляем очки на сервер лидерборда
    if (typeof socket !== 'undefined') {
        socket.emit('submit_score', { 
            name: playerName || 'Unknown Hero', 
            score: score 
        });
    }

    // Показываем кровавый экран смерти
    const goScreen = document.getElementById('game-over-screen');
    const finalScoreLabel = document.getElementById('final-score-display');
    if (goScreen && finalScoreLabel) {
        finalScoreLabel.innerText = `FINAL SCORE: ${score}`;
        goScreen.style.display = 'flex';
    }
}
