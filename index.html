    <script>
        // === ГЛОБАЛЬНЫЕ МАССИВЫ (СТАВИМ СЮДА, САМЫМ ПЕРВЫМ В СКРИПТЕ) ===

        window.enemies = window.enemies || [];

    function createVoxelHero() {
        const hero = new THREE.Group();

        // Цветовая палитра героя
        const cRed = 0xd63031;       // кепка, оправа, галстук
        const cWhite = 0xf5f6fa;     // лицо, манжеты
        const cBlack = 0x1e272e;     // линзы, обувь, рот
        const cGrey = 0x636e72;      // костюм
        const cBelt = 0x2d3436;      // пояс

        const mat = (col) => new THREE.MeshLambertMaterial({ color: col });

        function addBox(w, h, d, x, y, z, color, parent = hero) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat(color));
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            parent.add(mesh);
            return mesh;
        }

        // 1. Обувь и ноги
        const legL = addBox(0.32, 0.28, 0.5, -0.22, 0.14, 0, cBlack);
        const legR = addBox(0.32, 0.28, 0.5, 0.22, 0.14, 0, cBlack);

        // 2. Тело и одежда
        addBox(0.72, 0.38, 0.52, 0, 0.44, 0, cGrey);         // пальто
        addBox(0.74, 0.12, 0.54, 0, 0.46, 0, cBelt);         // пояс
        addBox(0.42, 0.18, 0.54, 0, 0.58, 0.01, cWhite);     // воротник
        addBox(0.14, 0.14, 0.56, 0, 0.56, 0.02, cRed);       // галстук

        // Руки
        addBox(0.2, 0.36, 0.24, -0.46, 0.46, 0, cRed);       // рукав L
        addBox(0.2, 0.36, 0.24, 0.46, 0.46, 0, cRed);        // рукав R
        addBox(0.18, 0.14, 0.22, -0.46, 0.24, 0, cWhite);    // кисть L
        addBox(0.18, 0.14, 0.22, 0.46, 0.24, 0, cWhite);     // кисть R

        // 3. Голова
        const headGroup = new THREE.Group();
        addBox(0.85, 0.72, 0.75, 0, 1.05, 0, cWhite, headGroup); // основа головы
        addBox(0.14, 0.12, 0.08, 0, 0.88, 0.4, cBlack, headGroup); // рот

        // Очки
        addBox(0.78, 0.1, 0.1, 0, 1.12, 0.4, cRed, headGroup);         // оправа
        addBox(0.26, 0.18, 0.1, -0.22, 1.04, 0.4, cBlack, headGroup); // линза L
        addBox(0.26, 0.18, 0.1, 0.22, 1.04, 0.4, cBlack, headGroup);  // линза R

        // 4. Кепка
        addBox(0.88, 0.28, 0.78, 0, 1.45, 0, cRed, headGroup);
        addBox(0.46, 0.12, 0.25, 0, 1.58, 0.05, cRed, headGroup);
        addBox(0.26, 0.08, 0.35, 0.42, 1.42, -0.28, cRed, headGroup); // козырек

        hero.add(headGroup);
        hero.scale.set(1.4, 1.4, 1.4);

        hero.userData = { legL, legR, head: headGroup };
         // Разворачиваем персонажа ровно на 180 градусов
        return hero;
    }

playerMaxHp = 100;

function damagePlayer(amount) {
    if (amount > 0) {
        if (typeof playPlayerHurtSound === 'function') playPlayerHurtSound();
        if (typeof speakPlayerHurt === 'function') speakPlayerHurt();
    }

    if (playerArmor > 0) {
        if (playerArmor >= amount) {
            playerArmor -= amount;
        } else {
            const leftover = amount - playerArmor;
            playerArmor = 0;
            playerHp -= leftover;
        }
    } else {
        playerHp -= amount;
    }

    const hpEl = document.getElementById('player-hp');

        hpEl.innerText = `HP: ${Math.max(0, Math.round(playerHp))} | ARMOR: ${Math.max(0, Math.round(playerArmor))}`;

const M_HOOD = new THREE.MeshLambertMaterial({ color: 0xb53549 });

const M_NECRO_ROBE = new THREE.MeshLambertMaterial({ color: 0x474968 });

function makeSkull(eyeMat, scale = 1.0) {
    const head = new THREE.Group();
    const cranium = new THREE.Mesh(new THREE.BoxGeometry(0.5 * scale, 0.42 * scale, 0.46 * scale), M_BONE);
    cranium.position.y = 0.15 * scale;
    cranium.userData.isHead = true;
    head.add(cranium);

    const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.36 * scale, 0.2 * scale, 0.38 * scale), M_BONE);
    jaw.position.set(0, -0.12 * scale, 0.04 * scale);
    jaw.userData.isHead = true;
    head.add(jaw);

    const eL = new THREE.Mesh(new THREE.BoxGeometry(0.08 * scale, 0.08 * scale, 0.05 * scale), eyeMat);
    eL.position.set(-0.12 * scale, 0.05 * scale, 0.24 * scale);
    const eR = eL.clone();
    eR.position.x = 0.12 * scale;
    head.add(eL, eR);
    return head;
}
// Генератор ног для скелетов
function makeSkeletonLegs(scale = 1.0) {
    const legsGroup = new THREE.Group();

    const boneMat = typeof M_BONE !== 'undefined' ? M_BONE : new THREE.MeshLambertMaterial({ color: 0xdddddd });
    const darkMat = typeof M_DARK !== 'undefined' ? M_DARK : new THREE.MeshLambertMaterial({ color: 0x333333 });

    // Левая нога
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.12 * scale, 0.65 * scale, 0.12 * scale), boneMat);
    legL.position.set(-0.16 * scale, 0.35 * scale, 0);
    const footL = new THREE.Mesh(new THREE.BoxGeometry(0.14 * scale, 0.1 * scale, 0.25 * scale), darkMat);
    footL.position.set(-0.16 * scale, 0.05 * scale, 0.06 * scale);

    // Правая нога
    const legR = legL.clone();
    legR.position.x = 0.16 * scale;
    const footR = footL.clone();
    footR.position.x = 0.16 * scale;

    legsGroup.add(legL, legR, footL, footR);
    return legsGroup;
}

let waveInProgress = false;

function spawnWave(waveNum) {
    waveInProgress = false;
    playerArmor = window.playerMaxArmor || 50;
    damagePlayer(0);

    enemies.forEach(e => scene.remove(e));
    enemies.length = 0;
    // Очищаем кости от прошлой волны, чтобы движок не лагал
    boneDebris.forEach(b => scene.remove(b.mesh));
    boneDebris.length = 0;

    const cfg = WAVE_CONFIG[waveNum - 1] || WAVE_CONFIG[WAVE_CONFIG.length - 1];

    function spawnPack(count, createFn) {
        for (let i = 0; i < count; i++) {
            const mob = createFn();
            const angle = Math.random() * Math.PI * 2;
            const dist = 22 + Math.random() * 14;
            const spawnX = playerGroup.position.x + Math.cos(angle) * dist;
            const spawnZ = playerGroup.position.z + Math.sin(angle) * dist;

            // Корректная высота по карте
            const groundY = typeof getGroundHeight === 'function' ? getGroundHeight({ x: spawnX, z: spawnZ }) : 0;
            mob.position.set(spawnX, groundY, spawnZ);

            // Регистрация частей тела для попаданий пуль
            mob.traverse(child => {
                if (child.isMesh) {
                    child.userData.rootMob = mob;
                    child.castShadow = true;
                }
            });

            scene.add(mob);
            enemies.push(mob);
        }
    }

    // Спавним все 5 типов врагов согласно конфигу текущей волны
    spawnPack(cfg.minion, createMinionMob);
    spawnPack(cfg.rogue, createRogueMob);
    spawnPack(cfg.warrior, createWarriorMob);
    spawnPack(cfg.necromancer, createNecromancerMob);
    spawnPack(cfg.golem, createGolemBoss);

    const scoreEl = document.getElementById('player-score');
    if (scoreEl) {
        scoreEl.innerText = `ВОЛНА ${waveNum} | ВРАГОВ: ${enemies.length}`;
    }

    waveInProgress = true;
}

function createFourBarricades(targetX, targetZ) {
    // Чистим старые, если были

    const woodDarkMat = new THREE.MeshStandardMaterial({ color: 0x423528, roughness: 0.9 });
    const woodTipMat = new THREE.MeshStandardMaterial({ color: 0xc49a6c, roughness: 0.7 }); // Светлые срезы кольев

    const radius = 8.5; // Дистанция от костра
    const gap = 0.42;   // 2 прохода (сверху и снизу)

    const barricadeDefs = [
        { id: 'bar_1', startAngle: gap, endAngle: Math.PI / 2 },
        { id: 'bar_2', startAngle: Math.PI / 2, endAngle: Math.PI - gap },
        { id: 'bar_3', startAngle: Math.PI + gap, endAngle: (3 * Math.PI) / 2 },
        { id: 'bar_4', startAngle: (3 * Math.PI) / 2, endAngle: 2 * Math.PI - gap }
    ];

    barricadeDefs.forEach((def, index) => {
        const barGroup = new THREE.Group();
        const postsCount = 10;
        const postsPositions = [];

        for (let j = 0; j < postsCount; j++) {
            const t = j / (postsCount - 1);
            const currentAngle = def.startAngle + t * (def.endAngle - def.startAngle);

            const px = targetX + Math.sin(currentAngle) * radius;
            const pz = targetZ + Math.cos(currentAngle) * radius;

            // Разнобой по высоте кольев (от 1.8м до 2.3м)
            const postHeight = 1.85 + (Math.sin(j * 3.7) * 0.35 + 0.1);
            const postRadius = 0.16 + (Math.cos(j * 1.5) * 0.03);

            const stake = new THREE.Group();
            stake.position.set(px, 0, pz);

            // Ствол бревна
            const cylinder = new THREE.Mesh(
                new THREE.CylinderGeometry(postRadius, postRadius * 1.15, postHeight, 7),
                woodDarkMat
            );
            cylinder.position.y = postHeight / 2;
            cylinder.castShadow = true;
            stake.add(cylinder);

            // Острый заточенный кончик колышка
            const tipHeight = 0.45;
            const cone = new THREE.Mesh(
                new THREE.ConeGeometry(postRadius, tipHeight, 7),
                woodTipMat
            );
            cone.position.y = postHeight + tipHeight / 2;
            cone.castShadow = true;
            stake.add(cone);

            // Легкий наклон кольев вразнобой для атмосферы
            stake.rotation.x = (Math.sin(j * 5.1) * 0.08);
            stake.rotation.z = (Math.cos(j * 4.3) * 0.08);

            barGroup.add(stake);
            postsPositions.push({ x: px, z: pz });
        }

        // Поперечные перекладины (горизонтальные и косые распорки)
        const midAngle = (def.startAngle + def.endAngle) / 2;
        const arcLen = (def.endAngle - def.startAngle) * radius;

        [-0.14, 0.14].forEach((sideOffset, sIdx) => {
            const bx = targetX + Math.sin(midAngle) * (radius + sideOffset);
            const bz = targetZ + Math.cos(midAngle) * (radius + sideOffset);

            // Нижняя перекладина
            const b1 = new THREE.Mesh(new THREE.BoxGeometry(arcLen * 1.02, 0.15, 0.14), crossBeamMat);
            b1.position.set(bx, 0.65, bz);
            b1.rotation.y = midAngle + Math.PI / 2;
            barGroup.add(b1);

            // Верхняя перекладина
            const b2 = new THREE.Mesh(new THREE.BoxGeometry(arcLen * 1.0, 0.15, 0.14), crossBeamMat);
            b2.position.set(bx, 1.35, bz);
            b2.rotation.y = midAngle + Math.PI / 2;
            barGroup.add(b2);

            // Диагональная доска-упор
            const diag = new THREE.Mesh(new THREE.BoxGeometry(arcLen * 0.9, 0.12, 0.12), crossBeamMat);
            diag.position.set(bx, 1.0, bz);
            diag.rotation.y = midAngle + Math.PI / 2;
            diag.rotation.z = sIdx === 0 ? 0.35 : -0.35;
            barGroup.add(diag);
        });

        barGroup.userData = {
            id: def.id,
            index: index,
            isBarricade: true,
            hp: 350,
            maxHp: 350,
            posts: postsPositions, // точки бревен для расчета коллизий
            radius: radius,
            startAngle: def.startAngle,
            endAngle: def.endAngle
        };

        scene.add(barGroup);
        barricades.push(barGroup);
    });
}

            // 1. В лунную волну костер НЕ тратит топливо (передышка для игрока)
            if (active && !isMoonWave && fireFuel > 0) {
                fireFuel = Math.max(0, fireFuel - fuelDecayRate * dt);
            }

            if (fireFuel <= 25) {
                currentFireStage = 1;
            } else if (fireFuel <= 68) {
                currentFireStage = 2;
            } else {
                currentFireStage = 3;
            }

            const cfg = FIRE_STAGES[currentFireStage];
            fireLight.color.setHex(cfg.color);

            // 2. Плавный восход/закат Луны и переключение освещения карты
            const targetMoonY = isMoonWave ? 48 : -25; // На 5-й волне луна поднимается высоко в небо
            moonMesh.position.y += (targetMoonY - moonMesh.position.y) * 0.03;

            const targetMoonIntensity = isMoonWave ? 1.35 : 0.0;
            fullMoonLight.intensity += (targetMoonIntensity - fullMoonLight.intensity) * 0.04;

            const targetAmbient = isMoonWave ? 0.55 : 0.045;
            ambientLight.intensity += (targetAmbient - ambientLight.intensity) * 0.04;

            const targetFog = isMoonWave ? 0.012 : cfg.fog; // При луне туман рассеивается, видно всю карту
            if (scene.fog) {
                scene.fog.density += (targetFog - scene.fog.density) * 0.04;
            }

            fireGroup.scale.lerp(new THREE.Vector3(cfg.scale, cfg.scale, cfg.scale), 0.06);

            flames.forEach((f) => {
                const wave = Math.sin(time * f.speed + f.phase);
                const wave2 = Math.cos(time * (f.speed * 0.7) + f.phase);
                f.mesh.scale.y = 1.0 + wave * 0.35;
                f.mesh.scale.x = 1.0 - wave * 0.15;
                f.mesh.scale.z = 1.0 + wave2 * 0.15;
                f.mesh.position.x = f.baseX + wave2 * 0.07;
                f.mesh.position.z = f.baseZ + wave * 0.07;
                f.mesh.rotation.y += 0.03;
            });

            const flicker = Math.sin(time * 14) * 0.12 + Math.cos(time * 23) * 0.08;
            const targetIntensity = cfg.intensity + flicker * (cfg.intensity * 0.22);
            fireLight.intensity += (targetIntensity - fireLight.intensity) * 0.1;
            fireLight.distance += (cfg.distance - fireLight.distance) * 0.08;

            if (playerPos) {
                playerAuraLight.position.set(playerPos.x, playerPos.y + 1.8, playerPos.z);
            }

            if (active && playerPos) {
                for (let i = woodPickups.length - 1; i >= 0; i--) {
                    const pile = woodPickups[i];
                    pile.rotation.y += 0.02;
                    if (pile.userData.spark) {
                        pile.userData.spark.position.y = 0.85 + Math.sin(time * 5 + i) * 0.18;
                    }
                    const dx = playerPos.x - pile.position.x;
                    const dz = playerPos.z - pile.position.z;
                    if (Math.hypot(dx, dz) < 3.2 && woodInventory < maxWoodCarry) {
                        scene.remove(pile);
                        woodPickups.splice(i, 1);
                        woodInventory++;
                        // Через 14 секунд в лесу вырастает новая охапка дров!
                        setTimeout(spawnWoodPile, 14000);
                    }
                    // Подбор ящиков с патронами
                for (let i = ammoPickups.length - 1; i >= 0; i--) {
                    const ammo = ammoPickups[i];
                    ammo.rotation.y += 0.015;
                    const dx = playerPos.x - ammo.position.x;
                    const dz = playerPos.z - ammo.position.z;
                    if (Math.hypot(dx, dz) < 3.2) {
                        scene.remove(ammo);
                        ammoPickups.splice(i, 1);
                        
                        // Даем патроны на все оружия
                        WEAPONS[1].reserve += 3;
                        WEAPONS[2].reserve += 30;
                        WEAPONS[3].reserve += 6;
                        if (typeof updateAmmoHud === 'function') updateAmmoHud();
                        if (typeof showKillBanner === 'function') showKillBanner("📦 AMMO FOUND!", 'body');

                        // Новый ящик спавнится через 18 секунд
                        setTimeout(spawnAmmoBox, 18000);
                    }
                }
                }

                
            }

            updateFireHud(active, isMoonWave, waveNum);
        }

       // =========================================================================
        // --- 7. КИНЕМАТОГРАФИЧНЫЙ РЕМАСТЕР 5 КЛАССОВ ВРАГОВ И ИХ АНИМАЦИИ ---

        // Определяем архетип моба по структуре старой модели или по тегам
        function getMobArchetype(mobRoot) {
            if (mobRoot.userData?.archetype) return mobRoot.userData.archetype;
            
            let boxCount = 0;
            let hasTall = false;
            mobRoot.traverse(c => {
                if (c.isMesh && c.geometry && c.geometry.parameters) {
                    boxCount++;
                    const p = c.geometry.parameters;
                    if ((p.height || 0) > 1.6) hasTall = true;
                }
            });

            if (boxCount > 12 || hasTall || (mobRoot.scale && mobRoot.scale.x > 1.4)) return 'golem';
            return 'minion';
        }

        function upgradeMobToCinematic(mob) {
            if (!mob || mob.userData.isCinematicUpgraded) return;
            mob.userData.isCinematicUpgraded = true;

            let archetype = mob.userData?.archetype || 'minion';
            if (mob === window.lastSpawnedGolem || (mob.scale && mob.scale.x > 1.4)) {

            // Индивидуальные хитбоксы и масштабы под каждый из 5 классов

                case 'shield': mob.scale.set(1.15, 1.1, 1.15); break;

          mob.traverse(node => {

                }

           const isGolem = (archetype === 'golem');
            const isNecro = (archetype === 'scythe' || archetype === 'necromancer');

            for (let s = 0; s < 4; s++) {

               if (isRight) {

                    } else if (archetype === 'crossbow' || archetype === 'rogue') {

              } else if (isGolem) {

                    } else {

                if (!isRight && (archetype === 'shield' || isGolem)) {
                    const shield = new THREE.Mesh(new THREE.BoxGeometry(0.1, archetype === 'shield' ? 1.2 : 0.9, 0.7), skelMats.ironArmor);
                    shield.position.set(-0.1, -0.2, 0.2);
                    elbow.add(shield);
                }

                torso.add(shoulder);
                return { shoulder, elbow };
            }

            const leftArm = buildArm(false);
            const rightArm = buildArm(true);

            function buildLeg(xPos) {
                const hip = new THREE.Group();
                hip.position.set(xPos, 0.92, 0);

                const femur = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.46, 0.15), subBone);
                femur.position.y = -0.22;

                knee.position.set(0, -0.45, 0);
                hip.add(knee);

                const tibia = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.46, 0.12), mainBone);
                tibia.position.y = -0.22;
                knee.add(tibia);

                rig.add(hip);
                return { hip, knee };
            }

            const leftLeg = buildLeg(-0.18);
            const rightLeg = buildLeg(0.18);

            mob.userData.skelParts = {
                rig, torso, headGroup, jaw, soulCore,
                leftArm, rightArm, leftLeg, rightLeg,
                archetype, isGolem,
                phase: Math.random() * Math.PI * 2,
                speed: isGolem ? 5.5 : (archetype === 'scythe' ? 8.5 : 10.0)
            };
            
        // Привязываем каждую кость визуального скелета к общему хитбоксу моба
            rig.traverse(child => {
                if (child.isMesh) {
                    child.userData.rootMob = mob;
                    child.castShadow = true;
                }
            });

            cranium.userData.isHead = true;
            jaw.userData.isHead = true;

            mob.userData.skelParts = {
                rig, torso, headGroup, jaw, soulCore,
                leftArm, rightArm, leftLeg, rightLeg,
                archetype, isGolem,
                phase: Math.random() * Math.PI * 2,
                speed: isGolem ? 5.5 : (archetype === 'scythe' ? 8.5 : 10.0)
            };
        }
       
            // Проверка столкновения моба с баррикадой (дуговой сектор + колья)
        function checkMobBarricadeCollision(mob, delta = 0.016) {
            if (!mob || typeof barricades === 'undefined' || barricades.length === 0) return false;

            const mobX = mob.position.x;
            const mobZ = mob.position.z;
            const mobRadius = 0.65;
            const postRadius = 0.45;
            const hitDistSq = (mobRadius + postRadius) * (mobRadius + postRadius);

            for (let b = 0; b < barricades.length; b++) {
                const bar = barricades[b];
                if (!bar || !bar.userData || bar.userData.hp <= 0 || bar.visible === false) continue;

                // 1. Быстрая проверка расстояния до центра дуги баррикады
                const distToCenter = Math.hypot(mobX - fireX, mobZ - fireZ);
                if (Math.abs(distToCenter - bar.userData.radius) > 2.0) continue;

                // 2. Точная проверка по кольям
                const posts = bar.userData.posts;
                if (!posts) continue;

                for (let i = 0; i < posts.length; i++) {
                    const p = posts[i];
                    const dx = mobX - p.x;
                    const dz = mobZ - p.z;
                    const distSq = dx * dx + dz * dz;

                    if (distSq < hitDistSq) {
                        const dist = Math.sqrt(distSq);
                        const pushDist = (mobRadius + postRadius) - dist;
                        if (dist > 0.001) {
                            mob.position.x += (dx / dist) * pushDist;
                            mob.position.z += (dz / dist) * pushDist;
                        }

                        // Нанесение урона баррикаде мобом
                        const mobDmg = (mob.userData && mob.userData.damage) ? mob.userData.damage : 15;
                        bar.userData.hp -= mobDmg * 1.5 * delta;

                        // Визуальная тряска брёвен от ударов
                        bar.position.x = (Math.random() - 0.5) * 0.06;
                        bar.position.z = (Math.random() - 0.5) * 0.06;

                        if (bar.userData.hp <= 0) {
                            bar.userData.hp = 0;
                            bar.visible = false;
                            bar.position.set(0, 0, 0);
                            showKillBanner("⚠️ BARRICADE DESTROYED!", false);
                        }
                        return true;
                    }
                }
            }
            return false;
        }

        // Починка ближайшей баррикады с помощью дров (Клавиша E)
       function tryRepairNearestBarricade() {
            if (typeof barricades === 'undefined' || barricades.length === 0) return;

            let pPos = playerGroup ? playerGroup.position : camera.position;
            let nearestBar = null;
            let minDist = 4.8; 

            barricades.forEach(bar => {
                if (!bar.userData || !bar.userData.posts) return;
                bar.userData.posts.forEach(p => {
                    const d = Math.hypot(pPos.x - p.x, pPos.z - p.z);
                    if (d < minDist) {
                        minDist = d;
                        nearestBar = bar;
                    }
                });
            });

            if (!nearestBar) {
                showKillBanner("GET CLOSER TO THE BARRICADE!", false);
                return;
            }
            if (woodInventory <= 0) {
                showKillBanner("NO WOOD FOR REPAIR! (SEARCH IN THE FOREST)", false);
                return;
            }
            if (nearestBar.userData.hp >= nearestBar.userData.maxHp) {
                showKillBanner("BARRICADE IS FULLY REPAIRED!", false);
                return;
            }

            // Тратим 1 единицу дерева на починку
            woodInventory--;
            nearestBar.userData.hp = Math.min(nearestBar.userData.maxHp, nearestBar.userData.hp + 175);
            nearestBar.visible = true; 
            nearestBar.position.set(0, 0, 0);

            // Вычисляем процент и ПОСЛЕ этого выводим сообщение
            const percent = Math.round((nearestBar.userData.hp / nearestBar.userData.maxHp) * 100);
            showKillBanner(`🔨 BARRICADE REPAIRED! (${percent}%)`, false);
        }

        function updateAllMobAnimations(time) {
            let pPos = null;
            if (typeof player !== 'undefined' && player.position) pPos = player.position;
            else if (typeof playerMesh !== 'undefined' && playerMesh.position) pPos = playerMesh.position;
            else if (typeof camera !== 'undefined') pPos = camera.position;

            if (typeof enemies === 'undefined' || !Array.isArray(enemies)) return;

            enemies.forEach(mob => {
                if (!mob) return;
                if (!mob.userData.isCinematicUpgraded) upgradeMobToCinematic(mob);

                const p = mob.userData.skelParts;
                if (!p) return;
                // Проверка препятствия и атаки баррикады
                const isBlockedByBarricade = checkMobBarricadeCollision(mob, 0.016);

                const t = time * p.speed + p.phase;
                const swing = Math.sin(t);
                const bounce = Math.abs(Math.cos(t));

                p.leftLeg.hip.rotation.x = swing * 0.8;
                p.leftLeg.knee.rotation.x = Math.max(0, -swing * 0.85);
                p.rightLeg.hip.rotation.x = -swing * 0.8;
                p.rightLeg.knee.rotation.x = Math.max(0, swing * 0.85);

                p.rig.position.y = bounce * (p.isGolem ? 0.18 : 0.11);
                p.torso.rotation.z = Math.cos(t) * 0.06;
                p.torso.rotation.x = 0.18 + bounce * 0.05;
               if (p.soulCore) p.soulCore.rotation.y += 0.06;

                p.headGroup.rotation.y = Math.sin(t * 0.5) * 0.14;
                p.jaw.position.y = 0.05 - Math.abs(Math.sin(t * 1.5)) * 0.04;

                let dist = 999;
                if (pPos) dist = Math.hypot(pPos.x - mob.position.x, pPos.z - mob.position.z);
               // === СИСТЕМА УНИКАЛЬНЫХ АНИМАЦИЙ АТАКИ (ПО 2-3 ТИПА НА КЛАСС) ===
                if (isBlockedByBarricade) {
                    // Удар по баррикаде
                    const smash = Math.sin(time * 16 + p.phase);
                    p.rightArm.shoulder.rotation.x = -1.6 + smash * 0.8;
                    p.rightArm.elbow.rotation.x = -0.9;
                    p.leftArm.shoulder.rotation.x = -0.4;
                } else if (dist < 2.6) {
                    // Выбор атаки моба (меняется каждые ~2.5 секунды индивидуально для каждого моба)
                    const attackCycle = Math.floor((time * 0.4 + p.phase) % 3);
                    const atkTime = time * 14 + p.phase;

                    // --- 1. АТАКИ НЕКРОМАНТА (ЖНЕЦА С КОСОЙ) ---
                    if (p.archetype === 'scythe' || p.archetype === 'necromancer') {
                        if (attackCycle === 0) {
                            // Приём 1: Широкий горизонтальный срез косой
                            const slash = Math.sin(atkTime);
                            p.rightArm.shoulder.rotation.x = -1.2;
                            p.rightArm.shoulder.rotation.y = slash * 1.35;
                            p.rightArm.elbow.rotation.x = -0.6;
                            p.torso.rotation.y = slash * 0.4;
                        } else if (attackCycle === 1) {
                            // Приём 2: Вертикальный рубящий клевок лезвием в землю
                            const chop = Math.sin(atkTime);
                            p.rightArm.shoulder.rotation.x = -2.1 + chop * 1.2;
                            p.rightArm.shoulder.rotation.y = 0.2;
                            p.rightArm.elbow.rotation.x = -1.2;
                            p.leftArm.shoulder.rotation.x = -1.4 + chop * 0.6;
                        } else {
                            // Приём 3: Круговой подсекающий взмах с разворотом
                            const spin = Math.sin(atkTime * 1.3);
                            p.rightArm.shoulder.rotation.x = -0.9;
                            p.rightArm.shoulder.rotation.y = spin * 1.6;
                            p.rightArm.elbow.rotation.x = -0.3;
                            p.torso.rotation.x = 0.35;
                        }
                    }
                    // --- 2. АТАКИ ВОИНА (ТАНКА С ЩИТОМ И ТОПОРОМ) ---
                    else if (p.archetype === 'shield' || p.archetype === 'warrior') {
                        if (attackCycle === 0) {
                            // Приём 1: Удар щитом с размаху (Shield Bash)
                            const bash = Math.sin(atkTime);
                            p.leftArm.shoulder.rotation.x = -1.5 + bash * 0.6;
                            p.leftArm.shoulder.rotation.y = 0.6;
                            p.leftArm.elbow.rotation.x = -0.3;
                            p.rightArm.shoulder.rotation.x = -0.4;
                        } else if (attackCycle === 1) {
                            // Приём 2: Нисходящий разрубающий удар топором
                            const axeChop = Math.sin(atkTime);
                            p.rightArm.shoulder.rotation.x = -2.2 + axeChop * 1.3;
                            p.rightArm.elbow.rotation.x = -1.1;
                            p.leftArm.shoulder.rotation.x = -1.2; // Щит держит перед собой
                        } else {
                            // Приём 3: Двойная связка (блок щитом + колющий выпад топором)
                            const combo = Math.sin(atkTime);
                            p.leftArm.shoulder.rotation.x = -1.4;
                            p.rightArm.shoulder.rotation.x = -1.2 + combo * 0.8;
                            p.rightArm.elbow.rotation.x = -0.5;
                        }
                    }
           // --- 3. АТАКИ ДЕМОНА-ГОЛЕМА (БОСС) ---
                    else if (p.isGolem) {
                        // ИСПРАВЛЕНИЕ: здесь нет переменной delta, используем фиксированный шаг времени 0.016 (16 мс)
                        enemy.userData.throwTimer = (enemy.userData.throwTimer || 0) - 0.016;

                        if (dist > 7.0) {
                            // Игрок далеко -> Кидаем валун
                            if (enemy.userData.throwTimer <= 0) {
                                enemy.userData.throwTimer = 3.5 + Math.random() * 2.0; // Кулдаун броска
                                
                                // Спавним огромный пылающий камень
                                const rock = new THREE.Mesh(
                                    new THREE.DodecahedronGeometry(0.65, 1),
                                    new THREE.MeshBasicMaterial({ color: 0xff3300, fog: false })
                                );
                                // Поднимаем точку спавна, чтобы камень вылетал из руки
                                rock.position.set(enemy.position.x, enemy.position.y + 4.0, enemy.position.z);

                                // Направляем камень в игрока + делаем дугу (вверх)
                                const targetPos = playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                                const dir = new THREE.Vector3().subVectors(targetPos, rock.position).normalize();
                                dir.y += 0.35; // Кидаем навесом
                                
                                scene.add(rock);
                                enemyBullets.push({
                                    mesh: rock, dir: dir, life: 5.0, damage: 45, isRock: true
                                });
                            }
                            
                            // Анимация замаха броска
                            const throwAnim = Math.sin(globalAnimTime * 3);
                            p.rightArm.shoulder.rotation.x = -2.8 + throwAnim * 0.5; // Рука отведена далеко назад
                            p.rightArm.elbow.rotation.x = -0.2;
                            p.leftArm.shoulder.rotation.x = -1.0;
                        } else {
                            // Ближний бой (если игрок подошел вплотную)
                            if (attackCycle === 0) {
                                const slam = Math.sin(atkTime * 0.7);
                                p.rightArm.shoulder.rotation.x = -2.4 + slam * 1.5;
                                p.rightArm.elbow.rotation.x = -0.9;
                                p.leftArm.shoulder.rotation.x = -2.2 + slam * 1.4;
                                p.leftArm.elbow.rotation.x = -0.9;
                            } else {
                                const sweep = Math.sin(atkTime * 0.8);
                                p.rightArm.shoulder.rotation.x = -1.1;
                                p.rightArm.shoulder.rotation.y = sweep * 1.4;
                                p.rightArm.elbow.rotation.x = -0.7;
                                p.leftArm.shoulder.rotation.x = -0.6;
                            }
                        }
                    }
                   // --- 4. АТАКИ МИНЬОНА (ОБЫЧНЫЙ СКЕЛЕТ: 4 РАЗНЫХ УДАРА) ---
                    else {
                        const minionCycle = Math.floor((time * 0.5 + p.phase) % 4);

                        if (minionCycle === 0) {
                            // Приём 1: Широкий косой замах справа налево с разворотом корпуса
                            const slash = Math.sin(atkTime);
                            p.rightArm.shoulder.rotation.x = -1.35;
                            p.rightArm.shoulder.rotation.y = slash * 1.25;
                            p.rightArm.elbow.rotation.x = -0.85;
                            p.leftArm.shoulder.rotation.x = -0.4;
                            p.torso.rotation.y = slash * 0.35;
                        } else if (minionCycle === 1) {
                            // Приём 2: Тяжелый вертикальный рубящий удар сверху вниз
                            const chop = Math.sin(atkTime);
                            p.rightArm.shoulder.rotation.x = -2.25 + chop * 1.35;
                            p.rightArm.shoulder.rotation.y = 0.15;
                            p.rightArm.elbow.rotation.x = -1.15;
                            p.leftArm.shoulder.rotation.x = -0.7 + chop * 0.4;
                            p.torso.rotation.x = 0.2 + chop * 0.15;
                        } else if (minionCycle === 2) {
                            // Приём 3: Резкий колющий выпад с выпрямлением локтя вперед
                            const thrust = Math.sin(atkTime * 1.2);
                            p.rightArm.shoulder.rotation.x = -1.55 + thrust * 0.35;
                            p.rightArm.shoulder.rotation.y = -0.2;
                            p.rightArm.elbow.rotation.x = -0.15 - Math.max(0, thrust) * 0.7;
                            p.leftArm.shoulder.rotation.x = -0.55;
                            p.torso.rotation.y = -0.2;
                        } else {
                            // Приём 4: Боковой удар наотмашь слева направо с наклоном
                            const backhand = Math.sin(atkTime * 1.1);
                            p.rightArm.shoulder.rotation.x = -1.1;
                            p.rightArm.shoulder.rotation.y = -0.4 - backhand * 1.1;
                            p.rightArm.elbow.rotation.x = -0.6;
                            p.leftArm.shoulder.rotation.x = -0.9 + backhand * 0.5;
                            p.torso.rotation.y = backhand * 0.3;
                        }
                    }
                } 
                // --- 5. ДАЛЬНИЙ БОЙ ДЛЯ ЛУЧНИКА (ROGUE / CROSSBOW) ---
                else if ((p.archetype === 'crossbow' || p.archetype === 'rogue') && dist <= 18.0) {
                    // Стойка стрельбы: левая рука удерживает лук, правая плавно натягивает тетиву
                    p.leftArm.shoulder.rotation.x = -1.55;
                    p.leftArm.shoulder.rotation.y = 0.2;
                    p.leftArm.elbow.rotation.x = -0.15;

                    const draw = Math.sin(time * 5.0);
                    p.rightArm.shoulder.rotation.x = -1.4;
                    p.rightArm.shoulder.rotation.y = -0.45;
                    p.rightArm.elbow.rotation.x = -1.2 + draw * 0.3;
                    p.torso.rotation.y = 0.25;
                } 
                // Спокойный бег / ходьба вне боя
                else {
                    p.rightArm.shoulder.rotation.x = swing * 0.8;
                    p.rightArm.shoulder.rotation.y = 0;
                    p.rightArm.elbow.rotation.x = -0.55;
                    p.leftArm.shoulder.rotation.x = -swing * 0.8;
                    p.leftArm.shoulder.rotation.y = 0;
                    p.torso.rotation.y = 0;
                }
            });
        }

        setInterval(() => {
            updateAllMobAnimations(performance.now() * 0.001);
        }, 16);
        const mBlack = new THREE.MeshStandardMaterial({ color: 0x1c1e24, roughness: 0.7 });

                new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff3300 : 0x88ccff })
            );
            visor.position.set(0, 2.06, 0.24);
            group.add(visor);

            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.28), suitMat);

            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.28), suitMat);

            group.userData.parts = { body, head, lArm, rArm, lLeg, rLeg, gunHolder, gun };

        }

        const enemies = [];

     function showKillBanner(text, hitType) {
            const feed = document.getElementById('kill-feed');
            const item = document.createElement('div');
            item.innerHTML = text;
            item.style.fontFamily = "'Pirata One', cursive";
            item.style.fontSize = hitType !== 'body' ? "38px" : "30px";
            
            if (hitType === 'core') {
                item.style.color = "#ffd700"; // Золотой/Желтый для сердца
                item.style.textShadow = "0 0 16px #ffaa00, 0 0 30px #000";
            } else if (hitType === 'head') {
                item.style.color = "#ff2222"; // Красный для головы
                item.style.textShadow = "0 0 16px #ff0000, 0 0 30px #000";
            } else {
                item.style.color = "#999999"; // Серый для обычного убийства
                item.style.textShadow = "0 0 10px rgba(0,0,0,0.8), 0 0 20px #000";
            }
            
            item.style.letterSpacing = "2px";
            item.style.opacity = "1";
            item.style.transform = "scale(1.2)";
            item.style.transition = "all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28)";

            feed.appendChild(item);
            setTimeout(() => { item.style.transform = "scale(1)"; }, 30);
            setTimeout(() => {
                item.style.opacity = "0";
                item.style.transform = "translateY(-20px) scale(0.9)";
            }, 1000);
            setTimeout(() => { if (item.parentNode) feed.removeChild(item); }, 1500);
        }

function spawnBoneExplosion(mob) {
    if (!mob) return;
    playBoneCrunchSound();

    // Рекурсивно собираем все видимые кости/меши моба
    const meshes = [];
    mob.traverse(child => {
        if (child.isMesh && child.visible && child.material && child.material.opacity > 0.05) {
            meshes.push(child);
        }
    });

    const origin = new THREE.Vector3();
    mob.getWorldPosition(origin);

    meshes.forEach(m => {
        const worldPos = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        const worldScale = new THREE.Vector3();
        m.getWorldPosition(worldPos);
        m.getWorldQuaternion(worldQuat);
        m.getWorldScale(worldScale);

        // Клонируем меш, чтобы он стал независимым объектом сцены
        const boneMesh = new THREE.Mesh(m.geometry.clone(), m.material.clone());
        boneMesh.position.copy(worldPos);
        boneMesh.quaternion.copy(worldQuat);
        boneMesh.scale.copy(worldScale);
        boneMesh.castShadow = true;
        boneMesh.receiveShadow = true;

        scene.add(boneMesh);

        // Импульс разлёта: направлен от центра моба вверх и в стороны
        const dir = new THREE.Vector3().subVectors(worldPos, origin);
        dir.y = 0;
        if (dir.lengthSq() < 0.001) {
            dir.set((Math.random() - 0.5), 0, (Math.random() - 0.5));
        }
        dir.normalize();

        const speed = 4.0 + Math.random() * 6.5;
        const vel = new THREE.Vector3(
            dir.x * speed + (Math.random() - 0.5) * 2.0,
            4.5 + Math.random() * 5.0, // Подброс вверх
            dir.z * speed + (Math.random() - 0.5) * 2.0
        );

        const rotVel = new THREE.Vector3(
            (Math.random() - 0.5) * 12.0,
            (Math.random() - 0.5) * 12.0,
            (Math.random() - 0.5) * 12.0
        );

        boneDebris.push({
            mesh: boneMesh,
            vel: vel,
            rotVel: rotVel,
            isGrounded: false
        });
    });

       // Конфигурация 3 видов оружия:
        // 1: Снайперка (1 патрон, долгая перезарядка 2.8 сек)
        // 2: Автомат (30 патронов, перезарядка 1.8 сек)
        // 3: Дробовик (6 патронов, перезарядка 2.2 сек)
       // Настройка физики оружия: pellets (кол-во дробинок), spread (разброс), auto (зажим ЛКМ)
       // Настройка оружия: добавлена переменная reserve (запасные патроны)
        const WEAPONS = {
            1: { name: 'SNIPER', maxAmmo: 1, ammo: 1, reserve: 3, fireDelay: 1.45, reloadTime: 2.8, sound: 'sniper', dmg: 140, auto: false, pellets: 1, spread: 0 },
            2: { name: 'RIFLE', maxAmmo: 30, ammo: 30, reserve: 30, fireDelay: 0.12, reloadTime: 1.8, sound: 'rifle', dmg: 28, auto: true, pellets: 1, spread: 0.035 },
            3: { name: 'SHOTGUN', maxAmmo: 6, ammo: 6, reserve: 6, fireDelay: 0.95, reloadTime: 2.2, sound: 'shotgun', dmg: 18, auto: false, pellets: 8, spread: 0.095 }
        };

         currentSlot = 1;
        let isReloading = false;
        let reloadTimer = 0;
        let isMouseDown = false; // Для зажима ЛКМ

        function updateAmmoHud() {
            const w = WEAPONS[currentSlot];
            const display = document.getElementById('ammo-display');
            const curEl = document.getElementById('ammo-current');
            const maxEl = document.getElementById('ammo-max');
            if (!display || !curEl || !maxEl) return;

            if (isReloading) {
                display.classList.add('reloading');
                curEl.innerText = 'RELOADING...';
                maxEl.innerText = '';
            } else {
                display.classList.remove('reloading');
                curEl.innerText = w.ammo;
                // Теперь справа выводится реальный запас (reserve), а не размер обоймы
                maxEl.innerText = `/ ${w.reserve}`; 
            }
        }

        function reloadWeapon() {
            const w = WEAPONS[currentSlot];
            // Блокируем перезарядку, если обойма полна ИЛИ если кончился резерв в кармане
            if (isReloading || w.ammo >= w.maxAmmo || w.reserve <= 0) return;
            isReloading = true;
            reloadTimer = w.reloadTime;
            updateAmmoHud();
        }

        function setWeapon(slot) {
            if (slot < 1 || slot > 3) return;
            currentSlot = slot;
            isReloading = false;
            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById(`slot-${i}`);
                if (el) el.classList.remove('active');
            }
            const activeEl = document.getElementById(`slot-${slot}`);
            if (activeEl) activeEl.classList.add('active');

            if (typeof gunMesh !== 'undefined' && gunMesh) {
                if (slot === 1) gunMesh.scale.set(0.8, 0.8, 1.7);
                if (slot === 2) gunMesh.scale.set(1.0, 1.1, 1.2);
                if (slot === 3) gunMesh.scale.set(1.3, 1.3, 1.0);
            }
            updateAmmoHud();
        }

        const keys = {};
        let yaw = 0, pitch = 0, sens = 0.0025;
        let playerVelY = 0;
        let isGrounded = true;
        let slideTimer = 0;
        let slideCooldown = 0;
        const slideDir = new THREE.Vector3();

        document.getElementById('sens-slider').addEventListener('input', (e) => { sens = 0.0008 * e.target.value; });

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.key === '1') setWeapon(1);
            if (e.key === '2') setWeapon(2);
            if (e.key === '3') setWeapon(3);
            if (e.code === 'KeyR' && gameActive) reloadWeapon();
            
            if (e.code === 'KeyE' && gameActive) {
                let pPos = playerGroup ? playerGroup.position : camera.position;
                const distToFire = Math.hypot(pPos.x - fireX, pPos.z - fireZ);
                if (distToFire < 4.5) {
                    if (woodInventory > 0) {
                        if (fireFuel < 95) {
                            woodInventory--;
                            fireFuel = Math.min(maxFuel, fireFuel + 40);
                            showKillBanner("🔥 WOOD ADDED TO CAMPFIRE!", false);
                        } else {
                            showKillBanner("CAMPFIRE IS ALREADY AT MAX HEAT!", false);
                        }
                    } else {
                        showKillBanner("NO WOOD! FIND IT IN THE FOREST", false);
                    }
                } else {
                    tryRepairNearestBarricade();
                }
            }

            if (e.code === 'Space' && isGrounded && gameActive) {
                playerVelY = 10.5;
                isGrounded = false;
            }

            const isSlideKey = (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyC');
            const hasMoveInput = keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'];
            if (isSlideKey && hasMoveInput && isGrounded && slideTimer <= 0 && slideCooldown <= 0 && gameActive) {
                const fwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const sd = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                slideDir.set(0, 0, 0);
                if (keys['KeyW']) slideDir.add(fwd);
                if (keys['KeyS']) slideDir.sub(fwd);
                if (keys['KeyA']) slideDir.add(sd);
                if (keys['KeyD']) slideDir.sub(sd);
               if (slideDir.lengthSq() > 0.001) {
                    slideDir.normalize();
                    slideTimer = 0.48; 
                    slideCooldown = 1.5; // Увеличен кулдаун до 1.5 сек (защита от спама)
                }
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * sens;
            pitch += e.movementY * sens;
            pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        });

        const raycaster = new THREE.Raycaster();
        let shootCooldownTimer = 0; 

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body || !gameActive) return;
            if (e.button === 0) {
                isMouseDown = true; // Зажимаем курок
                // Если оружие не автоматическое (снайперка/дробовик), стреляем сразу 1 раз по клику
                if (!WEAPONS[currentSlot].auto) tryFireWeapon(); 
            }
        });
        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) isMouseDown = false; // Отпускаем курок
        });

        function tryFireWeapon() {
            if (shootCooldownTimer > 0 || isReloading) return;
            const currentGun = WEAPONS[currentSlot];
            
            if (currentGun.ammo <= 0) {
                reloadWeapon();
                return;
            }

            currentGun.ammo--;
            updateAmmoHud();
            shootCooldownTimer = currentGun.fireDelay;

            if (typeof playGunSound === 'function') {
                if (currentSlot === 1) playGunSound('sniper');
                if (currentSlot === 2) playGunSound('rifle');
                if (currentSlot === 3) playGunSound('shotgun');
            }

            // Отдача модели оружия
            const kickback = currentSlot === 1 ? 0.35 : currentSlot === 3 ? 0.28 : 0.14;
            if (typeof gunMesh !== 'undefined' && gunMesh) {
                gunMesh.position.z -= kickback;
                setTimeout(() => { gunMesh.position.z = 0.35; }, 90);
                
                // Тряска камеры при спрее винтовки (отдача в экран)
                if (currentGun.auto) {
                    pitch += (Math.random() - 0.5) * 0.015;
                    yaw += (Math.random() - 0.5) * 0.015;
                }
            }

            const cameraDir = new THREE.Vector3();
            camera.getWorldDirection(cameraDir);

            // Обработка дробинок / разброса
            for (let p = 0; p < currentGun.pellets; p++) {
                const dir = cameraDir.clone();
                // Физика спрея/разброса дроби
                if (currentGun.spread > 0) {
                    dir.x += (Math.random() - 0.5) * currentGun.spread;
                    dir.y += (Math.random() - 0.5) * currentGun.spread;
                    dir.z += (Math.random() - 0.5) * currentGun.spread;
                    dir.normalize();
                }
                raycaster.set(camera.position, dir);

                const wallHits = raycaster.intersectObjects(colliders, false);
                const wallDist = wallHits.length > 0 ? wallHits[0].distance : Infinity;

                const hits = raycaster.intersectObjects(enemies, true);
                if (hits.length > 0 && hits[0].distance < wallDist) {
                    const hitMesh = hits[0].object;
                    const hitEnemy = hitMesh.userData.rootMob || (enemies.includes(hitMesh) ? hitMesh : (hitMesh.parent && hitMesh.parent.userData && hitMesh.parent.userData.rootMob ? hitMesh.parent.userData.rootMob : null));

                  if (hitEnemy && hitEnemy.userData && hitEnemy.userData.hp !== undefined) {
                        if (hitEnemy.userData.hp <= 0) continue; // Защита: моб уже убит

                    // Ищем пробитие пули до ядра или головы (проверяем первые 3 хитбокса, чтобы прошить ребра)
                        let isCore = false;
                        let isHeadMesh = false;

                        for (let h = 0; h < Math.min(hits.length, 3); h++) {
                            // Если луч ушел дальше, чем на 60 см от точки первого попадания - не считаем (пуля застряла)
                            if (hits[h].distance - hits[0].distance > 0.6) break; 
                            
                            let obj = hits[h].object;
                            while (obj) { // Идем вверх по иерархии костей
                                if (obj.userData.isCore === true) isCore = true;
                                if (obj.userData.isHead === true) isHeadMesh = true;
                                obj = obj.parent;
                            }
                        }
                        
                        // Никаких расчетов по высоте! Только строгие физические хитбоксы
                        const isHeadshot = isHeadMesh && !isCore;

                        let hitType = 'body';
                        let finalDmg = currentGun.dmg;
                        let reward = 100;

                        if (isCore) {
                            hitType = 'core';
                            finalDmg *= 3.0;
                            reward = 150;
                        } else if (isHeadshot) {
                            hitType = 'head';
                            finalDmg *= 2.0;
                            reward = 125;
                        }

                        hitEnemy.userData.hp -= finalDmg;

                        if (typeof createBloodSplatter === 'function') createBloodSplatter(hits[0].point);

                        if (hitEnemy.userData.hp <= 0) {
                            spawnBoneExplosion(hitEnemy);
                            scene.remove(hitEnemy);
                            const idx = enemies.indexOf(hitEnemy);
                            if (idx !== -1) enemies.splice(idx, 1);
                            
                            if (typeof addScore === 'function') addScore(reward, hitType);

                            const scoreEl = document.getElementById('player-score');
                            if (scoreEl) scoreEl.innerText = `WAVE ${getDetectedWave()} | REMAINING: ${enemies.length}`;
                        }
                    }
                }
            }

            if (currentGun.ammo <= 0) reloadWeapon();
        }

                        

        const downRay = new THREE.Raycaster();

        function getGroundHeight(pos) {
            downRay.set(new THREE.Vector3(pos.x, pos.y + 1.4, pos.z), new THREE.Vector3(0, -1, 0));
            const hits = downRay.intersectObjects(walkableMeshes, false);
            if (hits.length > 0) {
                return hits[0].point.y;
            }
            return 0;
        }

        function checkCollision(pos, height = 1.8) {
            if (typeof barricades !== 'undefined' && barricades.length > 0) {
                const playerRadius = 0.4;
                const postRadius = 0.2;
                const blockDistSq = (playerRadius + postRadius) * (playerRadius + postRadius);

                for (let b = 0; b < barricades.length; b++) {
                    const bar = barricades[b];
                    if (!bar || !bar.userData || bar.userData.hp <= 0 || bar.visible === false) continue;

                    const posts = bar.userData.posts;
                    if (!posts) continue;

                    for (let i = 0; i < posts.length; i++) {
                        const p = posts[i];
                        const dx = pos.x - p.x;
                        const dz = pos.z - p.z;
                        if (dx * dx + dz * dz < blockDistSq) {
                            return true;
                        }
                    }
                }
            }

            const center = new THREE.Vector3(pos.x, pos.y + height * 0.5 + 0.15, pos.z);
            const box = new THREE.Box3().setFromCenterAndSize(center, new THREE.Vector3(0.75, height - 0.3, 0.75));
            for (let col of colliders) {
                const colBox = new THREE.Box3().setFromObject(col);
                if (box.intersectsBox(colBox)) return true;
            }
            return false;
        }

       const clock = new THREE.Clock();
        let globalAnimTime = 0;

        // Переиспользуемые векторы (Rule 3 Vibe/Vibe: никакого мусора в памяти внутри animate!)
        const _upAxis = new THREE.Vector3(0, 1, 0);
        const _forward = new THREE.Vector3();
        const _side = new THREE.Vector3();
        const _moveVec = new THREE.Vector3();
        const _toPlayer = new THREE.Vector3();
        const _perp = new THREE.Vector3();
        const _sepVec = new THREE.Vector3();

        function animate() {
            // Внутри твоей функции animate():
        updateBonfire(performance.now() * 0.001);
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            globalAnimTime += delta;

            if (gameActive) {
                if (slideCooldown > 0) slideCooldown -= delta;
                if (shootCooldownTimer > 0) shootCooldownTimer -= delta;
             // Перезарядка с учетом вычета из резерва
                if (isReloading) {
                    reloadTimer -= delta;
                    if (reloadTimer <= 0) {
                        isReloading = false;
                        const w = WEAPONS[currentSlot];
                        const needed = w.maxAmmo - w.ammo;
                        const take = Math.min(needed, w.reserve);
                        w.ammo += take;
                        w.reserve -= take;
                        updateAmmoHud();
                    }
                } else {
                    // Автоматическая стрельба при зажатой ЛКМ (теперь снаружи перезарядки!)
                    if (isMouseDown && WEAPONS[currentSlot].auto && shootCooldownTimer <= 0) {
                        tryFireWeapon();
                    }
                }

                _forward.set(0, 0, 1).applyAxisAngle(_upAxis, yaw);
                _side.set(1, 0, 0).applyAxisAngle(_upAxis, yaw);
                _moveVec.set(0, 0, 0);

                if (slideTimer > 0) {
                    slideTimer -= delta;
                    // Сбалансированная скорость подката (13.2 вместо читерских 15.5)
                    _moveVec.copy(slideDir).multiplyScalar(13.2 * delta);
                } else {
                    // Сбалансированная скорость бега + штраф при беге спиной вперед (KeyS)
                    const baseSpeed = keys['ShiftLeft'] ? 9.4 : 6.4;
                    if (keys['KeyW']) _moveVec.addScaledVector(_forward, baseSpeed * delta);
                    if (keys['KeyS']) _moveVec.addScaledVector(_forward, -baseSpeed * 0.72 * delta); // Назад бежим медленнее!
                    if (keys['KeyA']) _moveVec.addScaledVector(_side, baseSpeed * 0.88 * delta);
                    if (keys['KeyD']) _moveVec.addScaledVector(_side, -baseSpeed * 0.88 * delta);
                }

                // Движение по осям X и Z со скольжением вдоль стен и подъемом по ступенькам
                const nextPosX = playerGroup.position.clone();
                nextPosX.x += _moveVec.x;
                const groundX = getGroundHeight(nextPosX);
                if (groundX - playerGroup.position.y <= 0.65 && !checkCollision(new THREE.Vector3(nextPosX.x, Math.max(playerGroup.position.y, groundX), nextPosX.z))) {
                    playerGroup.position.x = nextPosX.x;
                }

                const nextPosZ = playerGroup.position.clone();
                nextPosZ.z += _moveVec.z;
                const groundZ = getGroundHeight(nextPosZ);
                if (groundZ - playerGroup.position.y <= 0.65 && !checkCollision(new THREE.Vector3(nextPosZ.x, Math.max(playerGroup.position.y, groundZ), nextPosZ.z))) {
                    playerGroup.position.z = nextPosZ.z;
                }

                // Вертикальная физика (прыжки, гравитация и высота пола/лестницы/2 этажа)
                const currentGround = getGroundHeight(playerGroup.position);
                if (isGrounded && currentGround > playerGroup.position.y && currentGround - playerGroup.position.y <= 0.65) {
                   playerGroup.position.y = currentGround; // Плавный подъем по ступенькам
                }

                playerVelY -= 24.0 * delta;
                playerGroup.position.y += playerVelY * delta;

                if (playerGroup.position.y <= currentGround) {
                    playerGroup.position.y = currentGround;
                    playerVelY = 0;
                    isGrounded = true;
                } else {
                    isGrounded = false;
                }

                playerGroup.rotation.y = yaw + Math.PI;

               

                // === ОБНОВЛЕНИЕ ПОВЕДЕНИЯ МОБОВ, РАСТАЛКИВАНИЯ И СТРЕЛЬБЫ ===
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    if (!enemy) continue;

                    // Поворот лицом к игроку
                    enemy.lookAt(playerGroup.position.x, enemy.position.y, playerGroup.position.z);

                    _toPlayer.subVectors(playerGroup.position, enemy.position);
                    _toPlayer.y = 0;
                    const dist = _toPlayer.length();
                    if (dist > 0.001) _toPlayer.divideScalar(dist); // Нормализуем вектор к игроку

                    // Перпендикулярный вектор (вбок) для зигзагов и обхода с флангов
                    _perp.set(-_toPlayer.z, 0, _toPlayer.x);

                    // --- АНТИ-СЛИПАНИЕ МОБОВ (Separation Force) ---
                    // Каждый моб отталкивается от слишком близких соседей, чтобы идти широкой толпой
                    _sepVec.set(0, 0, 0);
                    const minSepDist = enemy.userData.role === 'boss' ? 2.5 : 1.45;
                    for (let j = 0; j < enemies.length; j++) {
                        if (i === j) continue;
                        const other = enemies[j];
                        if (!other) continue;
                        const dx = enemy.position.x - other.position.x;
                        const dz = enemy.position.z - other.position.z;
                        const dSq = dx * dx + dz * dz;
                        if (dSq > 0.0001 && dSq < minSepDist * minSepDist) {
                            const d = Math.sqrt(dSq);
                            const pushStrength = (minSepDist - d) / minSepDist;
                            _sepVec.x += (dx / d) * pushStrength * 4.5;
                            _sepVec.z += (dz / d) * pushStrength * 4.5;
                        }
                    }

                   // 1. ДАЛЬНИЙ БОЙ: The Rogue (стрелок с физическими стрелами)
                    if (enemy.userData.role === 'shooter') {
                        // Держит дистанцию 11-15 метров
                        if (dist > 15.0) {
                            enemy.position.addScaledVector(_toPlayer, enemy.userData.speed * delta);
                        } else if (dist < 10.0) {
                            enemy.position.addScaledVector(_toPlayer, -enemy.userData.speed * 0.75 * delta);
                        }

                        // Боковой стрейф
                        const strafeWave = Math.sin(globalAnimTime * 1.6 + (enemy.userData.zigzagPhase || 0));
                        enemy.position.addScaledVector(_perp, strafeWave * 1.5 * delta);
                        enemy.position.addScaledVector(_sepVec, delta);

                        // Стрельба видимой стрелой
                        enemy.userData.shootTimer = (enemy.userData.shootTimer || 0) - delta;
                        if (enemy.userData.shootTimer <= 0 && dist <= (enemy.userData.attackRange || 18)) {
                            enemy.userData.shootTimer = (enemy.userData.shootInterval || 3.2) + Math.random() * 0.6;

                            if (typeof playBowReleaseSound === 'function') playBowReleaseSound();

                            // Собираем физическую стрелу
                            const arrow = new THREE.Group();
                            const shaft = new THREE.Mesh(
                                new THREE.CylinderGeometry(0.02, 0.02, 0.7, 4),
                                new THREE.MeshBasicMaterial({ color: 0x2b1d0c })
                            );
                            shaft.rotation.x = Math.PI / 2;
                            const tip = new THREE.Mesh(
                                new THREE.ConeGeometry(0.045, 0.14, 4),
                                new THREE.MeshBasicMaterial({ color: 0xff3300 }) // Светящийся наконечник
                            );
                            tip.rotation.x = -Math.PI / 2;
                            tip.position.z = 0.38;
                            arrow.add(shaft, tip);

                            arrow.position.set(enemy.position.x, enemy.position.y + 1.25, enemy.position.z);

                            // Небольшой разброс прицела лучника
                            const target = playerGroup.position.clone().add(new THREE.Vector3(
                                (Math.random() - 0.5) * 0.7,
                                1.0 + (Math.random() - 0.5) * 0.3,
                                (Math.random() - 0.5) * 0.7
                            ));
                            const dir = new THREE.Vector3().subVectors(target, arrow.position).normalize();
                            arrow.lookAt(arrow.position.clone().add(dir));

                            scene.add(arrow);
                            window.activeArrows.push({
                                mesh: arrow,
                                dir: dir,
                                speed: 20.0, // Скорость стрелы (успеваешь увернуться или сдать подкат)
                                life: 2.5,
                                damage: enemy.userData.damage || 8
                            });
                        }
                    }
                    // 2. БЛИЖНИЙ БОЙ: Minion, Necromancer, Warrior, Golem
                    else {
                        const hitDist = enemy.userData.role === 'boss' ? 2.8 : 1.75;
                        if (dist > hitDist) {
                            // На последних 3.5 метрах милишники делают рывок (ускоряются на 25%), чтобы от них нельзя было просто уйти пешком!
                            const lungeBoost = (dist < 3.8 && enemy.userData.role !== 'boss') ? 1.25 : 1.0;
                            enemy.position.addScaledVector(_toPlayer, enemy.userData.speed * lungeBoost * delta);

                            // Если у моба есть зигзаг (например, быстрый Некромант) — добавляем боковое уклонение
                            if (enemy.userData.zigzagAmp > 0 && dist > 3.0) {
                                const wave = Math.cos(globalAnimTime * enemy.userData.zigzagSpeed + (enemy.userData.zigzagPhase || 0));
                                enemy.position.addScaledVector(_perp, wave * enemy.userData.zigzagAmp * delta);
                            }

                            // Применяем расталкивание толпы
                            enemy.position.addScaledVector(_sepVec, delta);
                        } else {
                            // Даже когда стоят и бьют — не слипаются друг в друга
                            enemy.position.addScaledVector(_sepVec, 0.5 * delta);
                            enemy.userData.attackCooldown = (enemy.userData.attackCooldown || 0) - delta;
                            if (enemy.userData.attackCooldown <= 0) {
                                damagePlayer(enemy.userData.damage);
                                enemy.userData.attackCooldown = 0.9;
                            }
                        }
                    }
// Проверяем упор в частокол, не даем пройти и наносим урон забору
                    if (typeof checkMobBarricadeCollision === 'function') {
                        checkMobBarricadeCollision(enemy, delta);
                    }
                    // Привязываем мобов к высоте земли/ступенек, чтобы не ходили сквозь пол
                    if (typeof getGroundHeight === 'function') {
                        enemy.position.y = getGroundHeight(enemy.position);
                    }
                }
    // === ПРОВЕРКА ЗАВЕРШЕНИЯ ВОЛНЫ (ПЕРЕХОД К СЛЕДУЮЩЕЙ) ===
    if (gameActive && enemies.length === 0 && currentWave <= 10) {
        currentWave++;
        if (currentWave <= 10) {
            spawnWave(currentWave);
        } else {
            alert("Поздравляем! Все 10 волн успешно зачищены!");
            gameActive = false;
        }
    }
    // --- РЫЧАНИЕ СКЕЛЕТОВ ---
                for (let i = 0; i < enemies.length; i++) {
                    const e = enemies[i];
                    if (!e || !e.userData) continue;
                    e.userData.growlTimer = (e.userData.growlTimer || (2.0 + Math.random() * 5.0)) - delta;
                    if (e.userData.growlTimer <= 0) {
                        e.userData.growlTimer = 4.5 + Math.random() * 5.5; // Рычат раз в 4-10 секунд вразнобой
                        if (typeof playSkeletonGrowlSound === 'function') {
                            playSkeletonGrowlSound(e.position);
                        }
                    }
                }

                // --- ПОЛЕТ ФИЗИЧЕСКИХ СТРЕЛ ЛУЧНИКА ---
                for (let i = window.activeArrows.length - 1; i >= 0; i--) {
                    const arr = window.activeArrows[i];
                    arr.mesh.position.addScaledVector(arr.dir, arr.speed * delta);
                    arr.life -= delta;

                    const pBody = playerGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0));
                    const hitDist = arr.mesh.position.distanceTo(pBody);

                    // Попадание в игрока
                    if (hitDist < 0.8) {
                        // Если игрок в подкате — шанс 60% пролететь мимо
                        if (slideTimer <= 0 || Math.random() > 0.6) {
                            damagePlayer(arr.damage);
                        }
                        scene.remove(arr.mesh);
                        window.activeArrows.splice(i, 1);
                        continue;
                    }

                    // Попадание в стены/дерево или истечение времени полета
                    const hitWall = typeof checkCollision === 'function' ? checkCollision(arr.mesh.position, 0.2) : false;
                    if (hitWall || arr.life <= 0) {
                        scene.remove(arr.mesh);
                        window.activeArrows.splice(i, 1);
                    }
                }

              // Полет снарядов врагов (и валунов босса)
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const b = enemyBullets[i];
                    
                    // Если это камень босса - он летит медленнее, падает по параболе и вращается
                    if (b.isRock) {
                        b.mesh.position.addScaledVector(b.dir, 16.0 * delta);
                        b.dir.y -= 0.4 * delta; // Гравитация камня
                        b.mesh.rotation.x += 8.0 * delta;
                        b.mesh.rotation.z += 5.0 * delta;
                    } else {
                        b.mesh.position.addScaledVector(b.dir, 26.0 * delta); // Обычная пуля
                    }
                    
                    b.life -= delta;

                    // У камня хитбокс гораздо больше, чем у пули
                    const hitRadius = b.isRock ? 1.6 : 0.85;
                    const hitWall = checkCollision(b.mesh.position, hitRadius);
                    const hitPlayer = b.mesh.position.distanceTo(playerGroup.position.clone().add(new THREE.Vector3(0, 1.1, 0))) < hitRadius;
                    
                    // Камень также может разбиться об пол
                    const groundY = getGroundHeight(b.mesh.position);
                    const hitGround = b.mesh.position.y <= groundY;

                  if (hitPlayer) {
                        // Если попал камень - урон огромный, если пуля - обычный
                        playerHp -= b.damage || 10;
                        document.getElementById('player-hp').innerText = 'HP: ' + Math.max(0, playerHp);
                        scene.remove(b.mesh);
                        enemyBullets.splice(i, 1);
                        if (playerHp <= 0) {
                            triggerGameOver(); // Вызываем красивый экран смерти
                        }
                    } else if (hitWall || hitGround || b.life <= 0) {
                        scene.remove(b.mesh);
                        enemyBullets.splice(i, 1);
                    }
                }

                // Частицы крови
                for (let i = bloodParticles.length - 1; i >= 0; i--) {
                    const bp = bloodParticles[i];
                    bp.mesh.position.addScaledVector(bp.vel, delta);
                    bp.vel.y -= 14.0 * delta;
                    bp.life--;
                    if (bp.life <= 0) {
                        scene.remove(bp.mesh);
                        bloodParticles.splice(i, 1);
                    }
                }
                // Физика разлёта костей от убитых скелетов
                for (let i = 0; i < boneDebris.length; i++) {
                    const b = boneDebris[i];
                    if (!b.isGrounded) {
                        // Полёт и гравитация
                        b.mesh.position.addScaledVector(b.vel, delta);
                        b.vel.y -= 22.0 * delta; // Гравитация

                        // Вращение в воздухе
                        b.mesh.rotation.x += b.rotVel.x * delta;
                        b.mesh.rotation.y += b.rotVel.y * delta;
                        b.mesh.rotation.z += b.rotVel.z * delta;

                        // Проверка высоты пола
                        const groundH = typeof getGroundHeight === 'function' ? getGroundHeight(b.mesh.position) : 0;
                        if (b.mesh.position.y <= groundH + 0.08) {
                            b.mesh.position.y = groundH + 0.08;
                            // Если скорость удара была высокой — лёгкий отскок с затуханием
                            if (b.vel.y < -3.5) {
                                b.vel.y = -b.vel.y * 0.35;
                                b.vel.x *= 0.5;
                                b.vel.z *= 0.5;
                            } else {
                                b.isGrounded = true;
                                b.vel.set(0, 0, 0);
                            }
                        }
                    }
                }

                // Камера (опускается при скольжении)
                const camHeight = slideTimer > 0 ? 1.35 : 2.15;
                const camOffset = new THREE.Vector3(0.85, camHeight, -2.8);
                camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
                camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.copy(playerGroup.position).add(camOffset);

                const lookOffset = new THREE.Vector3(0.4, camHeight - 0.3, 10);
                lookOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
                lookOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.lookAt(playerGroup.position.clone().add(lookOffset));
            }
            // === ОТОБРАЖЕНИЕ ЗДОРОВЬЯ БАРРИКАД ===
            barricades.forEach(bar => {
                if (!bar.userData.hpLabel) {
                    const lbl = document.createElement('div');
                    lbl.style.position = 'absolute';
                    lbl.style.fontFamily = "'Share Tech Mono', monospace";
                    lbl.style.fontSize = '15px';
                    lbl.style.fontWeight = 'bold';
                    lbl.style.textShadow = '0 0 6px #000, 0 0 10px #000';
                    lbl.style.pointerEvents = 'none';
                    lbl.style.transform = 'translate(-50%, -50%)';
                    lbl.style.zIndex = '90';
                    document.body.appendChild(lbl);
                    bar.userData.hpLabel = lbl;
                }

                const lbl = bar.userData.hpLabel;
                if (bar.userData.hp > 0 && bar.visible && gameActive) {
                    const percent = Math.max(0, Math.round((bar.userData.hp / bar.userData.maxHp) * 100));
                    let color = '#00ff88'; // Зеленый
                    if (percent <= 60) color = '#ffaa00'; // Желтый
                    if (percent <= 30) color = '#ff3333'; // Красный

                    lbl.innerHTML = `<span style="color:${color}">🛡️ HP: ${percent}%</span>`;

                    // Вычисляем центральную точку баррикады в 3D
                    const midAngle = (bar.userData.startAngle + bar.userData.endAngle) / 2;
                    const posX = fireX + Math.sin(midAngle) * bar.userData.radius;
                    const posZ = fireZ + Math.cos(midAngle) * bar.userData.radius;
                    
                    // Проецируем 3D координаты в 2D координаты экрана
                    const worldPos = new THREE.Vector3(posX, 2.8, posZ);
                    worldPos.project(camera);

                    // Скрываем, если текст оказался за спиной камеры
                    if (worldPos.z > 1.0) {
                        lbl.style.display = 'none';
                    } else {
                        lbl.style.display = 'block';
                        const x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
                        const y = (worldPos.y * -0.5 + 0.5) * window.innerHeight;
                        lbl.style.left = `${x}px`;
                        lbl.style.top = `${y}px`;
                    }
                } else {
                    lbl.style.display = 'none';
                }
            });
            renderer.render(scene, camera);
        }
        

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        // ==========================================
        // НАСТРОЙКА 3D ДИОРАМЫ ГЛАВНОГО МЕНЮ
